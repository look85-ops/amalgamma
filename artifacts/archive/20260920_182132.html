<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Thousands of planned launches, terms of deal, worry some near Louisiana SpaceX site</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background:#000;height:100vh;display:grid;grid-template-columns:1fr 15vw 2fr 40px 1fr;grid-template-rows:1fr minmax(80px,0.5fr) 30vh 10vh;gap:1px;position:relative;overflow:hidden"><div style="background:linear-gradient(to bottom, #0a0a0f, #000);grid-column:1/span 5;grid-row:1/span 4"></div><div style="background:#111;grid-column:2/span 1;grid-row:2/span 1;border-top:1px solid #222;border-bottom:1px solid #222"></div><div style="background:#1a1a1a;grid-column:3/span提议 1;grid-row:3/span 1;margin-left:-2px"></div><div style="background:repeating-linear-gradient(90deg,transparent,transparent 1px,#222 1px,#222 3px);grid-column:4/span 1;grid-row:1/span 4;opacity:0.7"></div><div style="background:#050505;grid-column:5/span 1;grid-row:1/span 4;border-left:1px solid #1a1a1a"></div><div style="position:absolute;bottom:10vh;left:5vw;right:5vw;height:1px;background:linear-gradient(90deg, transparent, #444, #888, #444, transparent);opacity:0.3"></div><div style="position:absolute;top:30%;right:15vw;width:0.5px;height:30vh;background:linear-gradient(to bottom, transparent 0%, #333 15%, #555 50%, #333 85%, transparent 100%);animation:pulse 12s ease-in-out infinite"></div><style>@keyframes pulse{0%,100%{opacity:0.2}50%{opacity:0.8}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Thousands of planned launches, terms of deal, worry some near Louisiana SpaceX site</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
