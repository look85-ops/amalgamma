<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — The Papers: 'Another tax bombshell?' and 'Terror plot targets'</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background:#0a0a0a;width:100vw;height:100vh;position:relative;overflow:hidden">
  <div style="position:absolute;top:20%;left:10%;width:75%;height:1px;background:linear-gradient(90deg, transparent 0%, #5a0b0b 20%, #5a0b0b 80%, transparent 100%);animation:pulse 7s infinite ease-in-out"></div>
  <div style="position:absolute;top:35%;left:15%;width:65%;height:12vh;background:#1a1a1a;border-left:3px solid #333;opacity:0.85"></div>
  <div style="position:absolute;top:50%;right:8%;width:25%;height:40vh;background:repeating-linear-gradient(0deg, transparent, transparent 2px, #2a1a1a 2px, #2a1a1a細 4px);border-top:1px solid #5a0b0b"></div>
  <div style="position:absolute;bottom:15%;left:5%;width:90%;height:2px;background:#5a0b0b;opacity:0.4"></div>
  <div style="position:absolute;top:60%;left:20%;width:30%;height:20vh;background:#111;box-shadow:inset 0 0 30px #000"></div>
  <div style="position:absolute;top:10%;right:12%;width:8px;height:50vh;background:linear-gradient(to bottom, transparent, #3a0a0a, transparent);animation:breath 12s infinite linear"></div>
  <div style="position:absolute;bottom:30%;left:45%;width:1px;height:25vh;background:#444;opacity:0.3"></div>
  <style>
    @keyframes pulse { 0%, 100% { opacity:0.3; } 50% { opacity:0.8; } }
    @keyframes breath { 0%, 100% { opacity:0.1; transform:scaleY(0.95); } 50% { opacity:0.5; transform:scaleY(1.05); } }
  </style>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: The Papers: 'Another tax bombshell?' and 'Terror plot targets'</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
