<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Shearer on trials of MOTD & the manager's job that never was</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:linear-gradient(135deg,#0a0c27 0%,#1a0b38 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;position:relative"><div style="width:90%;max-width:800px"><div style="width:100%;height:6px;background:linear-gradient(90deg,transparent 0%,#e91a1e 50%,transparent 100%);margin-bottom:40px"></div><div style="display:flex;justify-content:space-between;width:100%"><div style="width:20%;height:200px;border-right:1px solid rgba(233,26,30,0.3);position:relative"><div style="position:absolute;top:50%;right:0;transform:translateY(-50%);width:80%;height:1px;background:rgba(233,26,30,0.5)"></div></div><div style="width:70%;display:flex;flex-direction:column"><div style="height:20px;background:rgba(233,26,30,0.2);margin-bottom:10px"></div><div style="display:flex;justify-content:space-between;margin-bottom:30px"><div style="width:48%;height:80px;border:1px solid rgba(233,26,30,0.1);position:relative"><div style="position:absolute;bottom:-10px;left:20px;width:60%;height:1px;background:rgba(233,26,30,0.3)"></div></div><div style="width:48%;height:80px;border-top:1px solid rgba(233,26,30,0.3);border-right:1px solid rgba(233,26,30,0.3)"></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:20px"><div style="height:5px;background:rgba(233,26,30,0.8)"></div><div style="height:5px;background:rgba(233,26,30,0.4)"></div><div style="height:5px;background:rgba(233,26,30,0.2)"></div></div><div style="height:1px;background:rgba(233,26,30,0.1);margin-bottom:30px"></div><div style="width:70%;height:1px;background:rgba(233,26,30,0.3);align-self:flex-end"></div></div></div><div style="position:absolute;bottom:20%;right:10%;width:100px;height:100px;border:1px solid rgba(233,26,30,0.1);transform:rotate(45deg)"></div><div style="position:absolute;bottom:30%;left:15%;width:60px;height:60px;border:1px solid rgba(233,26,30,0.05);transform:rotate(20deg)"></div></div></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Shearer on trials of MOTD & the manager's job that never was</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
