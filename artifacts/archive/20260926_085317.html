<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — The computer hacker who tried to take down Man City</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:fixed;inset:0;background:#0a0a0e;display:grid;grid-template-columns:1fr minmax(0,96vh) 1fr;grid-template-rows:1fr minmax(0,96vh) 1fr;gap:0.5vmin;pointer-events:none;"><div style="grid-column:2;grid-row:2;background:#111116;position:relative;overflow:hidden;"><div style="position:absolute;top:10%;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,#1a3a2a 20%,#1a3a2a 80%,transparent);animation:pulse 8s ease-in-out infinite;opacity:0.7;"></div><div style="position:absolute;bottom:30%;left:15%;width:70%;height:2px;background:linear-gradient(90deg,transparent,#2a1a2a 30%,#2a1a2a 70%,transparent);animation:pulse 11s ease-in-out infinite 1s;opacity:0.5;"></div><div style="position:absolute;top:40%;right:10%;width:3vmin;height:3vmin;background:#161a1f;border:1px solid #2a2a3a;border-radius:1px;animation:breath 13s ease-in-out infinite;opacity:0.9;"></div><div style="position:absolute;bottom:15%;left:20%;width:25%;height:25%;background:transparent;border:1px solid #1a1a2a;border-width:1px 0 0 1px;opacity:0.4;"></div><div style="position:absolute;top:20%;right:20%;width:15%;height:15%;background:transparent;border:1px solid #2a1a1a;border-width:0 1px 1px 0;opacity:0.3;"></div><div style="position:absolute;bottom:40%;left:50%;transform:translateX(-50%);width:1px;height:20%;background:linear-gradient(to top,transparent,#3a1a1a 40%,transparent);animation:flicker 7s steps(1,end) infinite;opacity:0.6;"></div></div><style>@keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:0.7;}}@keyframes breath{0%,100%{transform:scale(1);background:#161a1f;}50%{transform:scale(1.1);background:#1a161f;}}@keyframes flicker{0%,20%,60%,100%{opacity:0.3;}40%,80%{opacity:0.8;}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: The computer hacker who tried to take down Man City</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
