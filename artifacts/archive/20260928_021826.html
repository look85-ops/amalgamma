<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — South Africa reels from spate of mass shootings that killed 38 people in a week</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0a0a0a;display:grid;grid-template-columns:auto 82% auto;grid-template-rows:auto 62% auto;gap:0;cursor:default;overflow:hidden;"><div style="background-color:#4d0202;grid-column:2;grid-row:1;align-self:end;height:14vh;opacity:0.8;"></div><div style="background-color:#690303;grid-column:3;grid-row:1;align-self:end;height:20vh;opacity:0.65;"></div><div style="background-color:#4d0202;grid-column:2;grid-row:3;align-self:start;height:24vh;opacity:0.7;"></div><div style="background-color:#610303;grid-column:1;grid-row:3;align-self:start;height:18vh;margin-right:-15%;width:110%;opacity:0.9;"></div><div style="background:#000000;grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;"><div style="width:85%;height:70%;background:#170101;opacity:0.95;animation:pulse-eeriness 27s ease-in-out infinite alternate;"></div></div><div style="grid-column:3;grid-row:2;opacity:0.97;position:relative;margin:-7% 0 0 -25%;"><div style="width:30vh;height:1.5px;background:#260101;position:absolute;top:10%;left:0;animation:pulse-edge 11s ease-in-out 0.5s infinite alternate;"></div><div style="width:2px;height:18vh;background:#260101;position:absolute;top:45%;right:10%;animation:pulse-edge 7s ease-in-out 1.2s infinite alternate;"></div></div><style>@keyframes pulse-eeriness { 0%, 70% { opacity: 0.98; } 71%, 100% { opacity: 0.65; transform: scale(1.02); } } @keyframes pulse-edge { 0%, 85% { opacity: 0.3; } 86%, 100% { opacity: 0; } }</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: South Africa reels from spate of mass shootings that killed 38 people in a week</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
