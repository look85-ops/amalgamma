<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Perspective: Forget the ballroom, we're headed to Cheesecake Factory!</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:linear-gradient(135deg,#f5e6c8 0%,#ffd700 50%,#c19a6b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative"><div style="width:80%;height:60%;background:rgba(255,255,255,0.7);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(8,1fr);padding:20px"><div style="grid-column:1/span 3;grid-row:1/span 8;background:linear-gradient(to right,#8b4513 0%,#a0522d 100%);border-radius:15px 0 0 15px"></div><div style="grid-column:4/span 9;grid-row:1/span 8;background:url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\"><path d=\"M0,0 L100,0 L100,100 L0,100 Z\" fill=\"%23fff\" stroke=\"%23d4a76a\" stroke-width=\"1\"/><path d=\"M10,10 L90,10 L90,90 L10,90 Z\" fill=\"none\" stroke=\"%23d4a76a\" stroke-width=\"0.5\"/><path d=\"M20,20 L80,20 L80,80 L20,80 Z\" fill=\"none\" stroke=\"%23d4a76a\" stroke-width=\"0.3\"/></svg>');background-size:cover;border-radius:0 15px 15px 0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px"><div style="width:100%;height:20%;background:#d4a76a;border-radius:5px;margin-bottom:15px"></div><div style="width:80%;height:15%;background:#e6c8a0;border-radius:5px;margin-bottom:10px"></div><div style="width:60%;height:10%;background:#f0e0c0;border-radius:5px"></div></div></div><div style="position:absolute;bottom:20px;right:20px;width:100px;height:100px;background:conic-gradient(from 45deg,#ff6b6b 0%,#ffa502 25%,#feca57 50%,#ff9ff3 75%,#ff6b6b 100%);border-radius:50%;filter:blur(5px);opacity:0.7"></div></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Perspective: Forget the ballroom, we're headed to Cheesecake Factory!</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
