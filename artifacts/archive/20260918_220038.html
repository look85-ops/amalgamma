<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — When Trump and Xi meet they will discuss AI. 'Track Two' talks are already buzzing</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background-color:#0a0a0a;height:100vh;display:flex;overflow:hidden;position:relative;align-items:center;justify-content:center"><div style="height:90vh;width:1px;background-color:#2c2c2c;margin-right:40px;opacity:0.7"></div><div style="height:100vh;width:3px;background:linear-gradient(to bottom, transparent 10%, #5a0000 50%, transparent 90%);margin-right:80px;opacity:0.9;transform:scaleY(1.02);animation:pulse 7s ease-in-out infinite"></div><div style="display:flex;flex-direction:column;height:85vh;justify-content:space-between"><div style="width:220px;height:18px;background-color:#3a3a3a"></div><div style="width:220px;height:4px;background-color:#1a1a1a"></div><div style="width:180px;height:60px;background-color:#222222"></div><div style="width:220px;height:4px;background-color:#1a1a1a"></div><div style="width:200px;height:120px;background-color:#252525"></div><div style="width:220px;height:4px;background-color:#1a1a1a"></div></div><div style="position:absolute;bottom:20%;right:15%;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle, rgba(80,0,0,0.15) 1%, transparent 70%);filter:blur(2px);opacity:0.4"></div><div style="position:absolute;top:30%;left:10%;width:300px;height:1px;background:linear-gradient(to right, transparent, #444444, transparent);opacity:0.3"></div><div style="position:absolute;bottom:40%;right:30%;width:400px;height:1px;background:linear-gradient(to right, transparent, #333333, transparent);opacity:0.2"></div><style>@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:0.9}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: When Trump and Xi meet they will discuss AI. 'Track Two' talks are already buzzing</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
