<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — From cybersecurity to AI to Taiwan, what's at stake in Trump's summit with Xi</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:linear-gradient(to bottom, #0c0c14 0%, #111122 30%, #0a0a0a 70%, #000000 100%);position:relative;overflow:hidden">
  <div style="position:absolute;top:10%;left:15%;width:3px;height:60%;background:linear-gradient(to bottom, transparent 0%, #2a4a6a 15%, #2a4a6a 45%, transparent 100%);opacity:0.8"></div>
  <div style="position:absolute;top:25%;right:20%;width:8px;height:50px;background:#1e1e28;box-shadow:0 0 12px rgba(40,60,90,0.3);animation:pulse 4.7s ease-in-out infinite"></div>
  <div style="position:absolute;bottom:30%;left:40%;width:150px;height:150px;border:1px solid rgba(80,90,120,0.15);border-radius:1px;transform:rotate(15deg)"></div>
  <div style="position:absolute;top:45%;right:35%;width:2px;height:120px;background:#3a5060;opacity:0.5;transform:rotate(5deg)"></div>
  <div style="position:absolute;top:60%;left:25%;width:80px;height:1px;background:#4a5a70;opacity:0.6"></div>
  <div style="position:absolute;bottom:15%;right:10%;width:200px;height:200px;border:0.5px solid rgba(70,80,110,0.1);border-radius:2px;transform:rotate(-10deg)"></div>
  <div style="position:absolute;top:20%;left:50%;width:120px;height:120px;border:0.7px solid rgba(30,40,60,0.2);transform:rotate(45deg)"></div>
  <style>@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.7}}</style>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: From cybersecurity to AI to Taiwan, what's at stake in Trump's summit with Xi</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
