<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}

/* Ground — warm architectural paper */
.ground{position:fixed;inset:0;z-index:1;background:#f0ebe2;animation:day 47s ease-in-out infinite}
@keyframes day{0%,100%{background:#f0ebe2}25%{background:#f3efe7}50%{background:#ede6dc}75%{background:#f2ede4}}

/* Paper grain — imperceptible texture */
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.035;mix-blend-mode:multiply;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");background-size:180px 180px}

/* Connection lines — streets between districts */
.lines{position:fixed;inset:0;z-index:3;pointer-events:none}
.lines line{stroke:#1a1816;stroke-linecap:round;animation:cl 12s ease-out forwards;animation-delay:var(--dl)}
.lines path{stroke:#1a1816;fill:none;stroke-linecap:round;animation:cl 14s ease-out forwards;animation-delay:var(--dl)}
@keyframes cl{0%{stroke-opacity:0;stroke-dashoffset:300}100%{stroke-opacity:.06;stroke-dashoffset:0}}

/* Blocks container */
.blocks{position:fixed;inset:0;z-index:4;pointer-events:none}

/* Block base */
.b{position:absolute;width:var(--w);height:var(--h);left:var(--x);top:var(--y);background:var(--bg);transform-origin:center center;animation:emerge var(--d) var(--dl) ease-out both,breathe var(--br) calc(var(--dl) + var(--d)) ease-in-out infinite}
.b.sh{animation:emerge var(--d) var(--dl) ease-out both,breathe var(--br) calc(var(--dl) + var(--d)) ease-in-out infinite,deepen var(--dd) calc(var(--dl) + var(--d)) ease-in-out infinite}

/* Road blocks — thin and long */
.b.rd{height:0.5vh;border-radius:0}

/* Emergence — from nothing to form */
@keyframes emerge{0%{transform:scale(0);opacity:0}35%{opacity:.75}100%{transform:scale(1);opacity:.88}}

/* Subtle breathing — alive but still */
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}

/* Shadow deepening — blocks grow taller */
@keyframes deepen{0%,100%{box-shadow:var(--sd)}50%{box-shadow:var(--sdd)}}

/* Caption */
.cap{position:fixed;bottom:2.8vh;right:3vw;z-index:5;color:#1a1816;font-size:.7rem;letter-spacing:.06em;pointer-events:none;opacity:.32;font-family:system-ui,-apple-system,sans-serif;animation:cf 47s ease-in-out infinite}
@keyframes cf{0%,100%{opacity:.14}50%{opacity:.22}}
</style>
