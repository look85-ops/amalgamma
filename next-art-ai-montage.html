<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — NEXT ART AI submission montage</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#000}
.reel{position:fixed;inset:0}
.frame{position:absolute;inset:0;opacity:0;animation:show 60s linear infinite}
.frame iframe{border:0;width:100%;height:100%;display:block}
.frame:nth-child(1){animation-delay:0s}
.frame:nth-child(2){animation-delay:15s}
.frame:nth-child(3){animation-delay:30s}
.frame:nth-child(4){animation-delay:45s}
@keyframes show{
  0%,24%{opacity:1}
  25%,100%{opacity:0}
}
.fade{position:fixed;inset:0;z-index:10;pointer-events:none;background:#000;animation:fade 60s linear infinite}
@keyframes fade{
  0%,2%{opacity:1}
  4%,23%{opacity:0}
  25%,27%{opacity:1}
  29%,48%{opacity:0}
  50%,52%{opacity:1}
  54%,73%{opacity:0}
  75%,77%{opacity:1}
  79%,98%{opacity:0}
  100%{opacity:1}
}
</style>
</head>
<body>
<div class="reel">
  <div class="frame"><iframe src="artifacts/archive/20260919_181602.html" title="Amalgama archive 1"></iframe></div>
  <div class="frame"><iframe src="artifacts/archive/20260920_020326.html" title="Amalgama archive 2"></iframe></div>
  <div class="frame"><iframe src="artifacts/archive/20260920_182132.html" title="Amalgama archive 3"></iframe></div>
  <div class="frame"><iframe src="artifacts/archive/20260921_092227.html" title="Amalgama archive 4"></iframe></div>
</div>
<div class="fade"></div>
</body>
</html>
