<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — FBI hunting the hackers who stole its employees' sensitive data</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:relative;width:100vw;height:100vh;overflow:hidden;background:#0a0a0e;">
  <div style="position:absolute;top:10%;left:5%;width:40%;height:2px;background:linear-gradient(90deg, transparent, #1a1a22 30%, #2a2a35 70%, transparent);animation:pulse 8s ease-in-out infinite;"></div>
  <div style="position:absolute;top:20%;right:8%;width:4px;height:50%;background:#111118;opacity:0.8;"></div>
  <div style="position:absolute;bottom:30%;left:15%;width:30%;height:1px;background:#252530;opacity:0.6;"></div>
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:40%;border:0.5px solid #181820;box-sizing:border-box;opacity:0.4;"></div>
  <div style="position:absolute;bottom:15%;right:20%;width:25%;height:25%;background:radial-gradient(circle, #12121a 0%, transparent 70%);opacity:0.3;"></div>
  <div style="position:absolute;top:35%;right:30%;width:3px;height:3px;background:#2c2c3a;border-radius:50%;box-shadow:0 0 8px 2px rgba(44,44,58,0.5);animation:breath 12s infinite alternate;"></div>
  <div style="position:absolute;top:60%;left:10%;width:12%;height:12%;border:0.3px solid #1e1e28;opacity:0.2;transform:rotate(15deg);"></div>
  <div style="position:absolute;bottom:40%;right:10%;width:15%;height:2px;background:#1c1c24;opacity:0.5;animation:shift 20s linear infinite;"></div>
</div>
<style>
  @keyframes pulse { 0%,100% { opacity:0.1; } 50% { opacity:0.9; } }
  @keyframes breath { 0% { opacity:0.05; transform:scale(0.8); } 100% { opacity:0.5; transform:scale(1.2); } }
  @keyframes shift { 0% { transform:translateX(0); } 100% { transform:translateX(-5vw); } }
</style></div>
<div class="vig"></div>
<div class="src">current inspiration: FBI hunting the hackers who stole its employees' sensitive data</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
