<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Long agenda, short meeting: Trump and Xi meet</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;margin:0;padding:0;position:fixed;top:0;left:0;background:#111118;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden">
  <div style="width:90vmin;height:35vmin;border-top:2px solid rgba(45,47,60,0.9);border-bottom:2px solid rgba(45,47,60,0.9);position:relative">
    <div style="position:absolute;background:rgba(120,80,70,1);width:68vmin;height:10px;top:calc(50% - 5px);opacity:0.94;right:0"></div>
    <div style="position:absolute;background:rgba(140,110,90,0.88);width:42vmin;height:7px;top:20%;left:2vmin;clip-path:inset(0 0 0 99.5%);animation:pulse 15s ease-in-out infinite"></div>
    <div style="position:absolute;background:rgba(200,185,165,1);width:14px;height:calc(100% - 20vmin);top:10vmin;left:8vmin;opacity:0.6"></div>
  </div>
  <div style="margin-top:6vmin;width:95vmin;height:3vmin;display:flex;justify-content:space-between">
    <div style="background:rgba(80,70,65,1);width:6vmin;height:100%;opacity:0.75"></div>
    <div style="background:rgba(70,75,90,1);width:18vmin;height:100%;transform:scaleX(0.04);transform-origin:left;animation:breath 9s linear infinite"></div>
    <div style="background:rgba(130,95,90,0.7);width:2px;height:130%"></div>
  </div>
</div>
<style>@keyframes breath{0%,50%,100%{transform:scaleX(0.04)}25%,75%{transform:scaleX(1)}}@keyframes pulse{5%,20%{clip-path:inset(0 0 0 5%)}25%,98%{clip-path:inset(0 0 0 0)}95%{clip-path:inset(0 0 0 50%)}}</style></div>
<div class="vig"></div>
<div class="src">current inspiration: Long agenda, short meeting: Trump and Xi meet</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
