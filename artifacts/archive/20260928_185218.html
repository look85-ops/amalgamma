<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — The Trump administration weakens fuel efficiency standards for new cars</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#000;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center"><div style="width:60vmin;height:80vmin;background:#1a1a1a;position:relative"><div style="width:2%;height:100%;background:linear-gradient(to bottom, #3a3a3a 0%, #0a0a0a 40%, #3a3a3a 60%, #0a0a0a 100%);position:absolute;left:20%;animation:breathe 8s infinite ease-in-out"></div><div style="width:4%;height:92%;background:linear-gradient(to bottom, #2a2a2a 0%, #000 30%, #2a2a2a 70%, #000 100%);position:absolute;left:45%;animation:breathe 11s infinite ease-in-out;animation-delay:1s"></div><div style="width:3%;height:88%;background:linear-gradient(to bottom, #000 0%, #333 20%, #000 50%, #333 80%, #000 100%);position:absolute;left:70%;animation:breathe 9.5s infinite ease-in-out;animation-delay:2s"></div><div style="width:85%;height:10%;background:#111;position:absolute;bottom:15%;left:7.5%;opacity:0.95"></div><div style="width:90%;height:6%;background:#050505;position:absolute;bottom:30%;left:5%;opacity:0.98"></div><div style="position:absolute;top:10%;right:12%;width:15vmin;height:15vmin;background:radial-gradient(circle, transparent 30%, #222 30%, #222 40%, transparent 40%);animation:pulse 13s infinite linear;opacity:0.7"></div><div style="position:absolute;bottom:40%;left:10%;width:12vmin;height:12vmin;background:radial-gradient(circle, transparent 20%, #0f0f0f 20%, #0f0f0f 50%, transparent 50%);animation:pulse 17s infinite linear;opacity:0.6;animation-delay:5s"></div><style>@keyframes breathe{0%,100%{transform:scaleY(1);opacity:0.6}50%{transform:scaleY(0.97);opacity:0.9}}@keyframes pulse{0%{transform:scale(1);opacity:0.5}50%{transform:scale(1.05);opacity:0.8}100%{transform:scale(1);opacity:0.5}}</style></div></div></div>
<div class="vig"></div>
<div class="src">current inspiration: The Trump administration weakens fuel efficiency standards for new cars</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
