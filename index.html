<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — For workplace culture champions, Jensen Huang's return is 'unfathomable'</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width: 100vw; height: 100vh; background: linear-gradient(to bottom, #1a1a1a 0%, #0d0d0d 100%); position: relative; overflow: hidden; font-family: 'Helvetica Neue', sans-serif;">
  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 60%; background-color: #2a2a2a; box-shadow: 0 0 40px rgba(0, 0, 0, 0.7); border-radius: 8px; opacity: 0.9;">
    <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 30px;">
      <div style="width: 100%; height: 15%; background-color: #333333; border-radius: 4px; display: flex; align-items: center; padding-left: 20px; box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);">
        <div style="width: 20px; height: 20px; background-color: #ff5f56; border-radius: 50%; margin-right: 10px;"></div>
        <div style="width: 20px; height: 20px; background-color: #ffbd2e; border-radius: 50%; margin-right: 10px;"></div>
        <div style="width: 20px; height: 20px; background-color: #27c93f; border-radius: 50%;"></div>
      </div>
      <div style="width: 100%; height: 70%; background-color: #222222; border-radius: 4px; padding: 20px; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7); position: relative; overflow: hidden;">
        <div style="position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #cccccc;">
          <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; line-height: 1.3; max-width: 80%; text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);">
            <span style="color: #ff5f56;">$</span>ome who have worked to promote <span style="color: #66c2ff;">diversity</span> say Jensen's return sends a message
          </div>
          <div style="font-size: 36px; font-weight: bold; text-align: center; line-height: 1.2; max-width: 70%; text-shadow: 0 0 8px rgba(0, 0, 0, 0.7);">
            ALL THAT MATTERS IS <span style="color: #ffbd2e;">MONEY</span>
          </div>
        </div>
        <div style="position: absolute; bottom: 10px; right: 10px; width: 40px; height: 40px; background-color: #333333; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);">
          <div style="width: 15px; height: 15px; background-color: #66c2ff; border-radius: 50%;"></div>
        </div>
      </div>
      <div style="width: 100%; height: 10%; background-color: #333333; border-radius: 4px; display: flex; align-items: center; padding: 0 20px; box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);">
        <div style="width: 70%; height: 60%; background-color: #222222; border-radius: 20px;"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; bottom: 20px; right: 20px; width: 100px; height: 100px; background: radial-gradient(circle, rgba(255,95,86,0.3) 0%, rgba(255,95,86,0) 70%);"></div>
  <div style="position: absolute; top: 30px; left: 50px; width: 150px; height: 150px; background: radial-gradient(circle, rgba(102,194,255,0.2) 0%, rgba(102,194,255,0) 70%);"></div>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: For workplace culture champions, Jensen Huang's return is 'unfathomable'</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
