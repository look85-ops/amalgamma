<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Daughter of MP murdered five years ago tells BBC politicians still at risk</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background-color:#0a0a0a;height:100vh;width:100vw;position:relative;overflow:hidden"><div style="position:absolute;top:50%;left:0;width:100%;height:2px;background:linear-gradient(90deg, transparent 0%, #8b0000 10%, #8b0000 12%, transparent 100%);transform:translateY(-50%) scaleX(0.97);animation:pulse 14s ease-in-out infinite"></div><div style="position:absolute;top:0;left:20%;width:1px;height:100%;background:linear-gradient(to bottom, transparent 0%, #2a2a2a 15%, transparent 30%);opacity:0.7"></div><div style="position:absolute;bottom:25%;right:15%;width:32vmin;height:32vmin;border:1px solid #3a3a3a;transform:rotate(15deg);opacity:0.1"></div><div style="position:absolute;bottom:15%;left:10%;width:5vmin;height:5vmin;border-radius:50%;background:radial-gradient(circle at 30% 30%, #450000, #000);opacity:0.4;animation:breathe 19s infinite alternate"></div><div style="position:absolute;top:20%;right:30%;width:40vmin;height:1px;background-color:#222;box-shadow:0 0 1px #111"></div><div style="position:absolute;top:65%;left:5%;width:90%;height:1px;background:repeating-linear-gradient(90deg, transparent, transparent 3px, #1a1a1a 3px, #1a1a1a 6px)"></div><style>@keyframes pulse{0%,100%{opacity:0.2;transform:translateY(-50%) scaleX(0.97)}50%{opacity:0.8;transform:translateY(-50%) scaleX(1.03)}}@keyframes breathe{0%{transform:scale(1);opacity:0.2}100%{transform:scale(1.7);opacity:0.05}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Daughter of MP murdered five years ago tells BBC politicians still at risk</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
