<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — 'We came back from hell', say Ukrainians after years in Russia-occupied front-line city</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:linear-gradient(135deg,#000000 0%,#1a1a2e 50%,#3a3a5a 100%);position:relative;overflow:hidden"><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:60%;background:rgba(30,30,30,0.7);border:1px solid rgba(255,255,255,0.1);box-shadow:0 0 30px rgba(173,216,230,0.2)"><div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,0,0,0.7),transparent)"></div><div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,191,255,0.7),transparent)"></div><div style="position:absolute;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(255,255,255,0.03) 1px,rgba(255,255,255,0.03) 2px)"></div><div style="position:absolute;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;color:rgba(255,255,255,0.8);font-family:sans-serif;text-align:center;padding:20px"><div style="font-size:2em;margin-bottom:20px;text-shadow:0 0 10px rgba(255,255,255,0.3);letter-spacing:2px">WE CAME BACK FROM HELL</div><div style="width:60%;height:1px;background:rgba(255,255,255,0.2);margin-bottom:30px"></div><div style="font-size:0.9em;line-height:1.6;max-width:600px;text-shadow:0 0 5px rgba(0,0,0,0.5)">One evacuated couple says they crossed minefields in Oleshky in search of food.</div></div><div style="position:absolute;width:100%;height:100%;pointer-events:none"><div style="position:absolute;top:20%;left:10%;width:3px;height:3px;background:rgba(255,255,255,0.7);border-radius:50%;box-shadow:0 0 5px 2px rgba(255,255,255,0.5)"></div><div style="position:absolute;top:40%;right:15%;width:2px;height:2px;background:rgba(255,255,255,0.5);border-radius:50%;box-shadow:0 0 5px 1px rgba(255,255,255,0.3)"></div><div style="position:absolute;bottom:30%;left:25%;width:4px;height:4px;background:rgba(255,100,100,0.6);border-radius:50%;box-shadow:0 0 8px 3px rgba(255,100,100,0.4)"></div></div></div></div></div>
<div class="vig"></div>
<div class="src">current inspiration: 'We came back from hell', say Ukrainians after years in Russia-occupied front-line city</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
