<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Priest killed and four injured in knife attack at Polish abbey</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="
  position:relative;
  width:100vw;
  height:100vh;
  background:#000;
  overflow:hidden;
  font-size:0;
  border:none;
">
  <div style="
    position:absolute;
    top:5%;
    left:0;
    width:100%;
    height:50%;
    background:linear-gradient(90deg, 
      transparent 32%, 
      rgba(70,20,20,0.02) 32%,
      rgba(70,20,20,0.02) 33%, 
      transparent 33%
    );
    background-size:3.2% 100%;
  "></div>
  <div style="
    position:absolute;
    top:50%;
    left:25%;
    width:10%;
    height:25%;
    background:#111;
    opacity:0.9;
    clip-path:polygon(0% 0%, 100% 0%, 95% 100%, 0% 100%);
    animation: pulse 47s linear infinite;
  "></div>
  <div style="
    position:absolute;
    top:12%;
    left:68%;
    width:13%;
    height:45%;
    background:#1a0000;
    opacity:0.94;
    transform:rotate(4deg);
  "></div>
  <div style="
    position:absolute;
    bottom:10%;
    right:17%;
    width:15%;
    height:18%;
    background:radial-gradient(circle at 30% 40%, #280101 5%, transparent 70%);
    opacity:0.8;
  "></div>
  <div style="
    position:absolute;
    top:20%;
    left:8%;
    width:15%;
    height:25%;
    background:#000;
    border:1px solid rgba(50, 10, 10, 0.13);
    animation:float 101s ease-in-out infinite alternate;
  "></div>
</div>
<style>@keyframes pulse{0%{transform:translateX(0%) scaleY(1);opacity:0.9;}7%{opacity:0.7;}14%{opacity:0.9;}21%{opacity:0.6;}35%{transform:translateX(1.5%) scaleY(0.97);opacity:0.8;}65%{opacity:0.93;}85%{transform:translateX(0%) scaleY(1);opacity:0.9;}100%{transform:translateX(-0.7%) scaleY(1.02);opacity:0.91;}}@keyframes float{0%{transform:translate(0, 0);}100%{transform:translate(0.3vh, -0.7vh);}}</style></div>
<div class="vig"></div>
<div class="src">current inspiration: Priest killed and four injured in knife attack at Polish abbey</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
