<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Russia targeting 'ordinary life' with attacks on Ukraine's data centres, Zelensky says</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#0a0a12;display:flex;align-items:center;justify-content:center;overflow:hidden"><div style="width:85vmin;height:85vmin;position:relative"><div style="width:100%;height:3vmin;background:linear-gradient(90deg,#0a0a12 0%,#2a2a4a 15%,#2a2a4a 85%,#0a0a12 100%);position:absolute;top:32%;animation:pulse 11s ease-in-out infinite"></div><div style="width:100%;height:3vmin;background:linear-gradient(90deg,#0a0a12 0%,#1a1a3a 20%,#1a1a3a 80%,#0a0a12 100%);position:absolute;top:48%;animation:pulse 13.7s ease-in-out infinite 0.7s"></div><div style="width:100%;height:3vmin;background:linear-gradient(90deg,#0a0a12 0%,#3a3a5a 10%,#3a3a5a 90%,#0a0a12 100%);position:absolute;top:64%;animation:pulse 9.2s ease-in-out infinite 1.2s"></div><div style="position:absolute;width:40vmin;height:1.2vmin;background:#5a5a7a;top:22%;left:10%;opacity:0.87;transform:rotate(4deg)"></div><div style="position:absolute;width:25vmin;height:1.2vmin;background:#4a4a6a;bottom:18%;right:12%;opacity:0.73;transform:rotate(-3deg)"></div><div style="position:absolute;width:18vmin;height:8vmin;background:linear-gradient(to bottom,#1a1a3a,transparent);top:15%;right:22%;opacity:0.2"></div><div style="position:absolute;width:70%;height:1px;background:rgba(90,90,122,0.13);top:50%;left:15%"></div></div><style>@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.8}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Russia targeting 'ordinary life' with attacks on Ukraine's data centres, Zelensky says</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
