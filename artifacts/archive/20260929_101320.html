<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Migrants using longer, more dangerous routes across Channel</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0a0e14;overflow:hidden">
<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom, transparent 96%, #0a0e14 98%), repeating-linear-gradient(90deg, transparent 0px, transparent 1px, rgba(23, 37, 84, 0.03) 1px, rgba(23, 37, 84, 0.03) 2px);background-size:100% 100%, 4vmin 100vh;"></div>
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90vmin;height:1px;background:linear-gradient(90deg, transparent, rgba(180, 200, 255, 0.7), transparent);animation:pulse 8s infinite ease-in-out;"></div>
<div style="position:absolute;top:20vh;left:10vw;width:4vmin;height:60vh;background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.02) 2%, transparent);border-left:1px solid rgba(50,80,120,0.15);"></div>
<div style="position:absolute;top:35vh;right:15vw;width:6vmin;height:6vmin;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(70, 100, 150, 0.2), transparent 70%);animation:drift 40s infinite linear;"></div>
<div style="position:absolute;bottom:15vh;left:20vw;width:30vmin;height:3px;background:rgba(200,220,255,0.04);box-shadow:0 0 8px rgba(100,150,255,0.05);transform:rotate(-2deg);"></div>
<div style="position:absolute;top:10vh;right:25vw;width:1px;height:40vh;background:linear-gradient(to bottom, transparent, rgba(100,130,180,0.1) 10%, rgba(100,130,180,0.1) 40%, transparent);animation:breathe 12s infinite alternate ease-in-out;"></div>
<div style="position:absolute;bottom:30vh;left:60vw;width:15vmin;height:15vmin;border:1px solid rgba(80,110,160,0.07);transform:rotate(15deg);animation:weight 25s infinite alternate ease-in-out;"></div>
<div style="position:absolute;top:70vh;left:45vw;width:25vmin;height:2vmin;background:rgba(20,40,80,0.1);filter:blur(1px);transform:skewX(20deg);"></div>
<style>@keyframes pulse{0%,100%{opacity:0.1;width:80vmin;}50%{opacity:0.4;width:95vmin;}}@keyframes drift{0%{transform:translate(0,0);}25%{transform:translate(5vw,10vh);}50%{transform:translate(-3vw,15vh);}75%{transform:translate(7vw,5vh);}100%{transform:translate(0,0);}}@keyframes breathe{0%{height:35vh;opacity:0.05;}100%{height:45vh;opacity:0.15;}}@keyframes weight{0%{transform:rotate(15deg) scale(1);border-width:1px;}100%{transform:rotate(5deg) scale(1.1);border-width:1.5px;}}</style>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: Migrants using longer, more dangerous routes across Channel</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
