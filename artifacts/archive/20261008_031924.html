<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Trump approved the military's 1st firing squad execution since WWII. Why now?</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:relative;width:100vw;height:100vh;background:#000;overflow:hidden">
<div style="position:absolute;top:50%;left:35%;width:3px;height:1px;background:#ccc;box-shadow:9px 11vh 0 2px #666,77px 4vh 0 4px #ccc,32px -13vh 0 5px #444;-ms-transform:rotate(11deg);-o-transform:rotate(0);transform:rotate(23deg)">
</div>
<div style="position:absolute;bottom:30%;right:22%;width:80px;height:20px;background:transparent;border:8px solid #222;border-width:8px 0 0 8px">
</div>
<div style="position:absolute;bottom:40%;left:17%;width:110px;height:300px;background:linear-gradient(to top, transparent 3%, #111 30%, #111 70%, transparent 97%);opacity:0.7"></div>
<div style="position:absolute;top:20%;right:15%;width:1px;height:200px;background:#8a1212;animation:pulse--vert-lshort 4.7s infinite ease-out"></div>
<div style="position:absolute;bottom:10%;left:50%;width:600px;height:2px;background:#300;-o-transform:translate(-50%,0);transform:translate(-50%,0)"></div>
<div style="position:absolute;top:0;left:10%;width:90vw;height:100vh;background:repeating-linear-gradient(90deg,transparent 0px,transparent 99px,rgba(20,1,1,0.03) 100px,rgba(20,1,1,0.03) 197px)"></div>
<style>@keyframes pulse--vert-lshort{0%,100%{opacity:0.05;height:30px}25%,75%{opacity:0.18;height:140px}50%{opacity:0.45;height:190px}}</style>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: Trump approved the military's 1st firing squad execution since WWII. Why now?</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
