<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — UK to review Chagos Islands deal over lack of US support, Streeting tells BBC</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#0a0a12;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
  <div style="width:85vmin;height:85vmin;position:relative">
    <div style="position:absolute;top:0;left:15%;width:2px;height:100%;background:linear-gradient(to bottom, transparent 0%, #5a7c9a 15%, transparent 30%);background-repeat:no-repeat;background-size:100% 30%;animation:breath 8s ease-in-out infinite"></div>
    <div style="position:absolute;top:20%;right:10%;width:40%;height:40%;background-color:#1a1a2a;border:1px solid #2a3a4a;box-shadow:inset 0 0 30px #111122;transform:rotate(5deg)"></div>
    <div style="position:absolute;bottom:10%;left:5%;width:30vmin;height:2px;background-color:#7a8c9a;opacity:0.7;animation:pulse 4s 1s infinite"></div>
    <div style="position:absolute;top:50%;right:20%;width:12vmin;height:12vmin;border-radius:50%;background:radial-gradient(circle at 30% 30%, #3a4a5a, transparent 70%);opacity:0.4;transform:translateY(-50%)"></div>
    <div style="position:absolute;bottom:30%;left:50%;width:1px;height:25vmin;background:linear-gradient(to top, transparent, #4a5a6a 50%, transparent);transform:translateX(-50%);animation:breath 6s 2s infinite"></div>
    <div style="position:absolute;top:15%;right:30%;width:3px;height:3px;background-color:#9aabbc;box-shadow:0 0 10px 2px #9aabbc;animation:flicker размере 5s infinite"></div>
  </div>
</div>
<style>
  @keyframes breath { 0%, 100% { opacity: 0.3; } 50% { opacity: —0.7; } }
  @keyframes pulse { 0%, 100% { transform: scaleX(1); opacity: 0.7; } 50% { transform: scaleX(1.8); opacity: 0.3; } }
  @keyframes flicker { 0%, 60%, 62%, 100% { opacity: 0.2; } 61% { opacity: 1; } }
</style></div>
<div class="vig"></div>
<div class="src">current inspiration: UK to review Chagos Islands deal over lack of US support, Streeting tells BBC</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
