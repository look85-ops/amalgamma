<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgamma — Poland's prime minister warns of Russian 'accidental' attacks on Ukraine's allies</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#D4FF12}
.ppf{position:fixed;inset:0;z-index:2;pointer-events:none}
.pf{position:absolute;transform:translate(-50%,-50%);border-radius:50%;animation:p_beat var(--p) ease-in-out infinite;animation-delay:var(--del)}
@keyframes p_beat{0%,100%{transform:translate(-50%,-50%) scale(.7);opacity:.25}50%{transform:translate(-50%,-50%) scale(1.4);opacity:.7}}

.vig{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.55) 100%)}
.src{position:fixed;bottom:2.8vh;right:3vw;z-index:7;color:#4bdafc;font-size:.65rem;letter-spacing:.06em;opacity:.28;pointer-events:none;font-family:system-ui,-apple-system,sans-serif;animation:s_fade 89s ease-in-out infinite}
@keyframes s_fade{0%,100%{opacity:.18}50%{opacity:.35}}
</style>
</head>
<body>
<div class="ppf"><div class="pf" style="left:44%;top:69%;width:40vmin;height:8vmin;background:radial-gradient(circle,#4bdafc66 0%,#4bdafc22 35%,transparent 70%);--p:47s;--del:0s"></div><div class="pf" style="left:69%;top:46%;width:28vmin;height:6vmin;background:radial-gradient(circle,#4bdafc66 0%,#4bdafc22 35%,transparent 70%);--p:43s;--del:-3s"></div><div class="pf" style="left:56%;top:72%;width:18vmin;height:4vmin;background:radial-gradient(circle,#e3008466 0%,#e3008422 35%,transparent 70%);--p:41s;--del:-6s"></div></div>

<div class="vig"></div>
<div class="src">current inspiration: Poland's prime minister warns of Russian 'accidental' attacks on Ukraine's allies</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);

  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.05;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();

  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();

  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();

  const pulseInterval = 8.3;
  function update(t) {
    const wobble = 1 + Math.sin(t * 0.3) * 0.1 + Math.sin(t * 0.13) * 0.08;
    master.gain.value = wobble * 0.5;
    const p = (t % pulseInterval) / pulseInterval;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.08 : 0);
    requestAnimationFrame(update);
  }

  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
