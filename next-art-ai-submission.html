<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — NEXT ART AI 2026</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}

/* ── Scene container ── */
.scene{position:fixed;inset:0;opacity:0;animation:lifecycle 63s ease-in-out infinite}

/* ── Liquid grammar ── */
.scene-bg{position:absolute;inset:0;background:#F4FF8C}
.lbf{position:fixed;inset:0;z-index:2;pointer-events:none;filter:blur(3vmax)}
.lb{position:absolute;border-radius:50%;transform:translate(-50%,-50%);animation:l_morph var(--d) ease-in-out infinite;animation-delay:var(--del)}
@keyframes l_morph{0%,100%{transform:translate(-50%,-50%) scale(.8) rotate(0deg);opacity:.25}33%{transform:translate(-50%,-50%) scale(1.3) rotate(15deg);opacity:.55}66%{transform:translate(-50%,-50%) scale(.6) rotate(-10deg);opacity:.35}}

/* ── Vignette ── */
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ── Source line ── */
.src{position:fixed;bottom:2.8vh;right:3vw;z-index:12;color:#47ffa7;font-size:.65rem;letter-spacing:.06em;pointer-events:none;font-family:system-ui,sans-serif;text-align:right;opacity:0}
.src .line{display:block}
@keyframes src_fade{0%,5%{opacity:0}8%,90%{opacity:.28}95%,100%{opacity:0}}

/* ── End titles ── */
.titles{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;font-family:system-ui,sans-serif;opacity:0;color:rgba(255,255,255,.45);font-size:.8rem;letter-spacing:.05em;text-align:center;line-height:1.8}
@keyframes titles_fade{0%,92%{opacity:0}96%,100%{opacity:1}}

/* ── Lifecycle: 60s loop ──
   0-3s:    fade in (black → composition)
   3-57s:   full life (54 seconds breathing)
   57-60s:  fade out (composition → black)
   → repeat
*/
@keyframes lifecycle{0%,5%{opacity:1}0%{opacity:0}5%,94%{opacity:1}94%,100%{opacity:0}}

.src{animation:src_fade 60s ease-in-out infinite}
.titles{animation:titles_fade 60s ease-in-out infinite}

/* ── Fade overlay for smooth black transitions ── */
.fade-overlay{position:fixed;inset:0;z-index:15;pointer-events:none;background:#000;animation:fade_ov 60s ease-in-out infinite}
@keyframes fade_ov{0%,5%{opacity:0}0%{opacity:1}5%,94%{opacity:0}94%,100%{opacity:1}}
</style>
</head>
<body>

<div class="scene">
  <div class="scene-bg"></div>
  <div class="lbf">
    <div class="lb" style="left:59%;top:65%;width:70vmax;height:70vmax;background:radial-gradient(circle,#1044dc55 0%,#1044dc15 50%,transparent 75%);--d:36.5s;--del:0s"></div>
    <div class="lb" style="left:15%;top:-2%;width:22vmax;height:22vmax;background:radial-gradient(circle,#f43dff55 0%,#f43dff15 50%,transparent 75%);--d:44.5s;--del:-3s"></div>
    <div class="lb" style="left:87%;top:40%;width:25vmax;height:25vmax;background:radial-gradient(circle,#f43dff55 0%,#f43dff15 50%,transparent 75%);--d:48.5s;--del:-6s"></div>
    <div class="lb" style="left:5%;top:29%;width:21vmax;height:21vmax;background:radial-gradient(circle,#1044dc55 0%,#1044dc15 50%,transparent 75%);--d:33.5s;--del:-9s"></div>
    <div class="lb" style="left:9%;top:-14%;width:60vmax;height:60vmax;background:radial-gradient(circle,#1044dc55 0%,#1044dc15 50%,transparent 75%);--d:30.5s;--del:-12s"></div>
    <div class="lb" style="left:90%;top:64%;width:52vmax;height:52vmax;background:radial-gradient(circle,#1044dc55 0%,#1044dc15 50%,transparent 75%);--d:35.5s;--del:-2s"></div>
    <div class="lb" style="left:72%;top:49%;width:28vmax;height:28vmax;background:radial-gradient(circle,#47ffa755 0%,#47ffa715 50%,transparent 75%);--d:29.5s;--del:-8s"></div>
    <div class="lb" style="left:23%;top:25%;width:41vmax;height:41vmax;background:radial-gradient(circle,#47ffa755 0%,#47ffa715 50%,transparent 75%);--d:41.5s;--del:-5s"></div>
    <div class="lb" style="left:52%;top:8%;width:43vmax;height:43vmax;background:radial-gradient(circle,#1044dc55 0%,#1044dc15 50%,transparent 75%);--d:21.5s;--del:-15s"></div>
    <div class="lb" style="left:-18%;top:85%;width:30vmax;height:30vmax;background:radial-gradient(circle,#1044dc55 0%,#1044dc15 50%,transparent 75%);--d:26.5s;--del:-11s"></div>
  </div>
</div>

<div class="vig"></div>
<div class="src">
  <span class="line">current inspiration: 'I can get more time — that's everything':</span>
  <span class="line">Breast cancer patients get life-extending drug</span>
</div>

<div class="fade-overlay"></div>

<div class="titles">
  <span>github.com/look85-ops/amalgamma</span>
  <span>look85-ops.github.io/amalgamma</span>
</div>

<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);

  // drone — low sine, slow LFO on frequency
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();

  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.06;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();

  // noise — filtered white noise for texture
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;

  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;

  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.03;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();

  // rhythmic pulse — subtle low thump every ~8s
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();

  let pulsePhase = 0;
  const pulseInterval = 8.3;

  // master volume envelope — follows visual lifecycle
  function update(t) {
const cycleT = t % 60;

    if (cycleT < 3) env = cycleT / 3;           // fade in
    else if (cycleT < 57) env = 1;               // full
    else if (cycleT < 60) env = 1 - (cycleT - 57) / 3; // fade out
    else env = 0;                                 // silent

    // slight wobble
    const wobble = 1 + Math.sin(t * 0.3) * 0.15 + Math.sin(t * 0.13) * 0.1;
    master.gain.value = env * wobble * 0.7;

    // rhythmic pulse
    const p = (t % pulseInterval) / pulseInterval;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.12 : 0) * env;

    requestAnimationFrame(update);
  }

  // start on first user interaction or after short delay
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>

</body>
</html>
