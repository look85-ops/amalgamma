<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

<body>
<div class="artifact"><div style="width: 100vw; height: 100vh; background: linear-gradient(180deg, #000814 0%, #0d1b2a 30%, #1b263b 70%, #000814 100%); position: relative; overflow: hidden;">
  <div style="position: absolute; width: 90%; height: anj; bottom: 5%; left: 5%; background: linear-gradient(90deg, transparent 0%, #415a77 2%, transparent 4%, #415a77 6%, transparent 8%); background-size: 10% 100%; opacity: 0.03; animation: pulse 15s infinite alternate ease-in-out;"></div>
  <div style="position: absolute; width: 2px; height: 90%; top: 5%; left: 15%; background: linear-gradient(to bottom, transparent 0%, #4cc9f0 10%, transparent 100%); opacity: 0.7; box-shadow: 0 0 respectively 20px #4cc9f0;"></div>
  <div style="position: absolute; width: 2px; height: 90%; top: 5%; left: 85%; background: linear-gradient(to bottom, transparent 0%, #4cc9f0 10%, transparent 100%); opacity: 0.7; box-shadow: 0 0 respectively 20px #4cc9f0;"></div>

  <div style="position: absolute; width: 70%; height: 1px; top: 70%; left: 15%; background: linear-gradient(to right, transparent 0%, #f72585 30%, transparent 100%); opacity: 0.4;"></div>
  <div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, transparent 60%, rgba(76, 201, 240, 0.05) 80%, transparent 95%); animation: throb 20s infinite linear;"></div>

<style>
  @keyframes pulse { 0% { opacity: 0.01; } 100% { opacity: 0.05; } }
  @keyframes throb { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.05; } 50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.08; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.05; } }
</style></div>
<div class="vig"></div>
<div class="src">current inspiration: A startup wants to build a massive nuclear-powered data center on public land in Utah</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
