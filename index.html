<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — I find it quite demoralising in store - why I do all my shopping online</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="display: grid; height: 100vh; width: 100vw; background: #f2f2f2; grid-template-rows: 3fr 1fr 8fr; grid-template-columns: 1fr 2fr 1fr; gap: 2vmin;">
  <div style="grid-row: 1 / 2; grid-column: 1 / -1; background: linear-gradient(to bottom, #ccc, #eaeaea);"></div>
  <div style="grid-row: 2 / 3; grid-column: 2 / 3; background: #ffffff; box-shadow: 0 0 0.5vmin #ddd; align-self: center; justify-self: center; height: 12vmin; width: 60vmin;"></div>
  <div style="grid-row: 3 / 4; grid-column: 1 / -1; background: #d1d1d1; display: grid; grid-template-columns: repeat(20, 1fr); gap: 0.3vmin; padding: 2vmin;">
    <div style="background: #9b9b9b; height: 100%;"></div>
    <div style="background: #aaa; height: 90%; align-self: end;"></div>
    <div style="background: #8e8e8e; height: 70%; align-self: end;"></div>
    <div style="background: #bbb; height: 100%;"></div>
    <div style="background: #9c9c9c; height: 60%; align-self: end;"></div>
    <div style="background: #aaa; height: 95%;"></div>
    <div style="background: #828282; height: 100%;"></div>
    <div style="background: #cfcfcf; height: 50%; align-self: end;"></div>
    <div style="background: #929292; height: 75%; align-self: end;"></div>
    <div style="background: #868686; height: 100%;"></div>
    <div style="background: #afafaf; height: 100%;"></div>
    <div style="background: #828282; height: 90%; align-self: end;"></div>
    <div style="background: #9e9e9e; height: 60%; align-self: end;"></div>
    <div style="background: #bebebe; height: 100%;"></div>
    <div style="background: #8f8f8f; height: 70%; align-self: end;"></div>
    <div style="background: #8d8d8d; height: 100%;"></div>
    <div style="background: #a1a1a1; height: 40%; align-self: end;"></div>
    <div style="background: #757575; height: 80%; align-self: end;"></div>
    <div style="background: #aaaaaa; height: 100%;"></div>
    <div style="background: #979797; height: 95%; align-self: end;"></div>
  </div>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: I find it quite demoralising in store - why I do all my shopping online</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
