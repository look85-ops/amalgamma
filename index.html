<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Here are the Senate races to watch ahead of Election Day</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#0a0a14;position:relative;overflow:hidden"><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80vw;height:70vh;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:8px;box-shadow:0 0 40px rgba(10,10,30,0.8)"></div><div style="position:absolute;top:15%;left:10%;width:25px;height:25px;border-radius:50%;background:#e94560;box-shadow:0 0 20px #e94560;animation:pulse 3s infinite alternate"></div><div style="position:absolute;top:30%;right:15%;width:40px;height:40px;border-radius:50%;background:#0f3460;box-shadow:0 0 30px #0f3460;animation:pulse 4s infinite alternate"></div><div style="position:absolute;bottom:25%;left:20%;width:30px;height:30px;border-radius:50%;background:#533483;box-shadow:0 0 25px #533483;animation:pulse 3.5s infinite alternate"></div><div style="position:absolute;bottom:40%;right:25%;width:20px;height:20px;border-radius:50%;background:#6a097d;box-shadow:0 0 15px #6a097d;animation:pulse 2.5s infinite alternate"></div><div style="position:absolute;top:45%;left:45%;width:120px;height:120px;border:3px solid rgba(255,255,255,0.1);border-radius:50%"></div><div style="position:absolute;top:calc(45% - 30px);left:calc(45% - 30px);width:180px;height:180px;border:1px solid rgba(255,255,255,0.05);border-radius:50%"></div><div style="position:absolute;top:calc(45% - 60px);left:calc(45% - 60px);width:240px;height:240px;border:1px solid rgba(255,255,255,0.02);border-radius:50%"></div><style>@keyframes pulse{0%{opacity:0.3}100%{opacity:0.8}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Here are the Senate races to watch ahead of Election Day</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
