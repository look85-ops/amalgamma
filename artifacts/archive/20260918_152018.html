<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — South Africa 'feels like a prison' for women amid spate of femicides</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#0a0a0a;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(90deg,transparent 0px,transparent 3vmin,#1a0a0a 3vmin,#1a0a0a │ 3.5vmin);opacity:0.7"></div><div style="position:absolute;top:15%;left:10%;width:80%;height:70%;border:0.5vmin solid #300000;box-sizing:border-box"></div><div style="position:absolute;top:20%;left:15%;width:2vmin;height:60%;background:linear-gradient(to bottom,transparent,#500000,transparent);opacity:0.9"></div><div style="position:absolute;top:22%;right:20%;width:5vmin;height:56%;background:#210000;clip-path:polygon(30%0,100%0,70%100%,0%100%)"></div><div style="position:absolute;bottom:30%;left:30%;width:40%;height:0.3vmin;background:#5a0000;transform:scaleX(0);animation:pulse 8s infinite ease-in-out"></div><div style="position:absolute;top:40%;left:50%;width:0.7vmin;height:0.7vmin;border-radius:50%;background:#7a0000;filter:blur(1px);opacity:0;animation:fade 11s 1s infinite"></div><div style="position:absolute;top:35%;right:30%;width:25vmin;height:25vmin;border:0.4vmin dashed #250000;border-radius:50%;opacity:0.1"></div><div style="position:absolute;top:50%;left:20%;width:60%;height:0.2vmin;background:#200000;opacity:0.5"></div><style>@keyframes pulse{0%,100%{transform:scaleX(0);opacity:0.3}50%{transform:scaleX(1);opacity:0.8}}@keyframes fade{0%,100%{opacity:0;transform:translate(0,0)}50%{opacity:0.6;transform:translate(1vmin,-2vmin)}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: South Africa 'feels like a prison' for women amid spate of femicides</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
