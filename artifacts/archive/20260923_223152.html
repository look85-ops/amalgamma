<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — OpenAI and Anthropic bosses push UN for global terms on AI</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#0f1114;position:fixed;top:0;left:0;display:flex;align-items:center;justify-content:center;overflow:hidden"><div style="width:90vmin;height:90vmin;position:relative"><div style="width:86%;height:2px;background:linear-gradient(90deg, transparent, #2a3b5a 20%, #2a3b5a 80%, transparent);position:absolute;top:22%;left:7%;animation:pulse 8s infinite ease-in-out"></div><div style="width:2px;height:76%;background:linear-gradient(180deg, transparent, #3a2e4a 15%, #3a2e4a 85%, transparent);position:absolute;top:12%;left:33%;animation:breathe 12s infinite alternate"></div><div style="width:18vmin;height:18vmin;background:#1a1d25;position:absolute;bottom:18%;right:15%;border:1px solid #2c2f38;box-shadow:0 0 30px rgba(42,59,90,0.1)"></div><div style="width:24vmin;height:4px;background:#4a3e5a;position:absolute;top:65%;left:10%;opacity:0.7"></div><div style="width:3px;height:40vmin;background:linear-gradient(180deg, transparent, #1e2b3a, transparent);position:absolute;top:20%;right:28%"></div><div style="width:1px;height:50%;background:#2a2d35;position:absolute;top:25%;left:62%"></div><div style="width:14vmin;height:14vmin;background:transparent;border:1.5px solid #2a3b5a;position:absolute;top:15%;left:15%;opacity:0.4"></div><div style="width:60%;height:1px;background:#3a2e4a;position:absolute;bottom:30%;left:20%;opacity:0.5"></div></div><style>@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.9}}@keyframes breathe{0%{transform:translateY(-4vmin);opacity:0.4}100%{transform:translateY(4vmin);opacity:0.8}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: OpenAI and Anthropic bosses push UN for global terms on AI</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
