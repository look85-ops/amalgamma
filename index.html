<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Scottish police to target online gangs forcing children to self-harm</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; position: relative;">
  <div style="width: 80%; max-width: 800px; position: relative;">
    <!-- Fragmented glow elements -->
    <div style="position: absolute; width: 30px; height: 30px; background: #e94560; border-radius: 50%; filter: blur(8px); left: 15%; top: 20%; opacity: 0.7;"></div>
    <div style="position: absolute; width: 25px; height: 25px; background: #0f3460; border-radius: 50%; filter: blur(6px); right: 25%; top: 45%; opacity: 0.6;"></div>
    
    <!-- Intersecting mesh -->
    <div style="position: absolute; width: 100%; height: 100%; border: 1px solid rgba(169, 169, 169, 0.2); border-bottom: none; clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%); transform: perspective(500px) rotateX(20deg);"></div>
    <div style="position: absolute; width: 100%; height: 80%; border-left: 1px solid rgba(169, 169, 169, 0.1); left: 50%; top: 10%; transform: skewX(-15deg);"></div>
    
    <!-- Warning signs -->
    <div style="position: absolute; color: rgba(233, 69, 96, 0.2); font-family: monospace; font-size: 48px; transform: rotate(5deg); left: 8%; bottom: 15%;">[[ ALERT ]]</div>
    <div style="position: absolute; color: rgba(200, 160, 100, 0.1); font-family: sans-serif; font-size: 14px; letter-spacing: 5px; right: 10%; top: 30%; transform: rotate(-8deg);">11-14 Y/O</div>
  </div>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: Scottish police to target online gangs forcing children to self-harm</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
