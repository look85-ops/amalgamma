<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Henri B. Kagan and Kenso Soai win Nobel Prize in chemistry</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style='background:rgb(8,8,8);width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden'>
<div style='position:relative;width:80vmin;height:80vmin'>
<div style='background:linear-gradient(rgb(18,18,25),rgb(220,240,255) 35%,rgb(18,18,25));position:absolute;width:2vmin;height:35vmin;top:15vmin;left:35%;border-radius:10vmin;animation:resp 4.5s ease-in-out infinite'></div>
<div style='background:linear-gradient(45deg,rgba(250,245,205,0.06),transparent);position:absolute;width:25vmin;height:12vmin;top:30vmin;right:20%;border:0.1vmin solid rgba(250,250,230,0.03)'></div>
<div style='background:radial-gradient(circle,rgb(10,15,24),rgb(2,3,4) 70%);position:absolute;width:22vmin;height:22vmin;bottom:15vmin;left:25%;border-radius:50%;animation:pulse 11s ease-out infinite'></div>
<div style='background:repeating-linear-gradient(90deg,transparent,transparent 0.9vmin,rgba(165,180,215,0.03) 0.9vmin,rgba(165,180,215,0.03) 1vmin);position:absolute;width:50vmin;height:1vmin;top:20vmin;left:10vmin;opacity:0.7'></div>
<div style='position:absolute;width:0.3vmin;height:65vmin;background:rgba(220,230,255,0.12);top:0;left:42.5%;transform:rotate(15deg)'></div>
</div>
<style>
@keyframes resp { 0%,100% { transform:scaleY(1); opacity:0.8; } 50% { transform:scaleY(1.25); opacity:0.95; } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(20,45,100,0); } 50% { box-shadow: 0 0 0 8vmin rgba(20,45,100,0.09); } }
</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Henri B. Kagan and Kenso Soai win Nobel Prize in chemistry</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
