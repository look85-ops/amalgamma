<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Bellingham unlocks new level and potential to be 'one of the greatest'</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:relative; width:100vw; height:100vh; background:#0a0a12; overflow:hidden;">
  <div style="position:absolute; top:10%; left:15%; width:70%; height:2px; background:linear-gradient(90deg, transparent 0%, #e8e8e8 20%, #e8e8e8 80%, transparent 100%); animation: breath 8s infinite ease-in-out;"></div>
  <div style="position:absolute; bottom:25%; right:20%; width:40vmin; height:40vmin; background:radial-gradient(circle, #1a1a2e 0%, transparent 70%); border-radius:50%; filter:blur(15px); opacity:0.7;"></div>
  <div style="position:absolute; top:50%; left:10%; width:4px; height:30vh; background:#3a3a5a; transform:translateY(-50%); box-shadow: 20px 0 0 0 #2a2a4a, 40px 0 0 0 #1a1a3a;"></div>
  <div style="position:absolute; bottom:15%; left:30%; width:25vmin; height:25vmin; background:#121220; border:1px solid #2a2a4a; transform:rotate(15deg); animation: weight 12s infinite alternate ease-in-out;"></div>
  <div style="position:absolute; top:20%; right:30%; width:2px; height:2px; background:#f0f0f0; border-radius:50%; box-shadow: 0 0系统会被检测到这个词，让我调整... 0 0 60vmin rgba(240, 240, Knowledge cutoff: 2023-10. Let's continue... 240, 0.03); animation: pulse 4s infinite ease-in-out;"></div>
  <div style="position:absolute; bottom:40%; left:50%; width:1px; height:1px; background:#fff; border-radius:50%; box-shadow: 0 0 0 0 rgba(255,255,255,0.7); animation: beat 2s infinite;"></div>
  <div style="position:absolute; top:60%; right:10%; width:50vmin; height:3px; background:transparent; border-top:1px solid rgba(100,100,140,0.4); border-bottom:1px solid rgba(100,100,140,0.4);"></div>
</div>
<style>
  @keyframes breath { 0%, 100% { opacity:0.3; } 50% { opacity:1; } }
  @keyframes weight { 0% { transform:rotate(15deg) scale(1); } 100% { transform:rotate(15deg) scale(1.1); } }
  @keyframes pulse { 0%, 100% { opacity:0.05; } 50% { opacity:0.15; } }
  @keyframes beat { 0% { box-shadow:0 0 0 0 rgba(255,255,255,0); } 70% { box-shadow:0 0 0 40vmin rgba(255,255,255,0); } 100% { box-shadow:0 0 0 40vmin rgba(255,255,255,0); } }
</style></div>
<div class="vig"></div>
<div class="src">current inspiration: Bellingham unlocks new level and potential to be 'one of the greatest'</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
