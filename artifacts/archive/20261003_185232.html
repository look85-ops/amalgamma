<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — All's fair in love and 'War' — a well-cast, classy-trashy divorce drama</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background:linear-gradient(90deg,#0a0a0a 48%,transparent 0,transparent 52%,#0a0a0a 0);background-size:8vmin 8vmin;position:fixed;width:100vw;height:100vh;margin:0;overflow:hidden"><div style="width:60vmin;height:60vmin;background:linear-gradient(#2a1c1c 30%,transparent 0),linear-gradient(90deg,#3a2a2a 50%,transparent 0);background-size:4px 60vmin,60vmin 4px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.7;animation:pulse 24s infinite alternate ease-in-out"></div><div style="position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,transparent 60%,#0a0a0a);mix-blend-mode:multiply"></div><div style="position:absolute;left:45%;top:0;bottom:0;width:1.5vmin;background:linear-gradient(to bottom,transparent 45%,#8b0000 0,#8b0000 55%,transparent 0);background-size:100% 12vmin;animation:breath 8s infinite cubic-bezier(0.4,0,0.2,1)"></div><div style="position:absolute;right:35%;top:10%;width:25vmin;height:25vmin;border-radius:50%;background:conic-gradient(from 135deg,#3a2a2a,#1a0a0a 25%,transparent 0);filter:blur(2px);opacity:0.4"></div><div style="position:absolute;left:20%;bottom:15%;width:45vmin;height:18vmin;border-top:1.2vmin solid #2a1a1a;border-bottom:1.2vmin solid #2a1a1a;opacity:0.5"></div></div><style>@keyframes pulse{0%,20%{transform:translate(-50%,-50%) scale(1);opacity:0.7}80%,100%{transform:translate(-50%,-50%) scale(1.05);opacity:0.85}}@keyframes breath{0%,100%{opacity:0.3;transform:translateX(-25%)}50%{opacity:0.7;transform:translateX(25%)}}</style></div>
<div class="vig"></div>
<div class="src">current inspiration: All's fair in love and 'War' — a well-cast, classy-trashy divorce drama</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
