<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — With days to go before the midterms, data shows the U.S. economy is doing well</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ed 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Helvetica Neue', Arial, sans-serif; position: relative; overflow: hidden;">
  <div style="width: 80%; max-width: 800px;">
    <div style="background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 40px; position: relative; z-index: 2;">
      <div style="height: 8px; background: linear-gradient(90deg, #4CAF50 0%, #FFC107 50%, #F44336 100%); border-radius: 4px; margin-bottom: 30px;"></div>
      <h1 style="font-size: 2.2rem; color: #333; margin-bottom: 20px; line-height: 1.3;">With days to go...</h1>
      <p style="color: #555; line-height: 1.6; margin-bottom: 25px;">GDP grew at an annual rate of 3.4%...</p>
      <div style="display: flex; justify-content: space-between; margin-top: 30px;">
        <div style="width: 30%; height: 120px; background: rgba(76, 175, 80, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #4CAF50; font-weight: bold; font-size: 1.5rem;"></div>
        <div style="width: 30%; height: 120px; background: rgba(255, 193, 7, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #FFC107; font-weight: bold; font-size: 1.5rem;"></div>
        <div style="width: 30%; height: 120px; background: rgba(244, 67, 54, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #F44336; font-weight: bold; font-size: 1.5rem;"></div>
      </div>
    </div>
    <div style="position: absolute; width: 150%; height: 300px; background: linear-gradient(90deg, rgba(76, 175, 80, 0.05) 0%, rgba(255, 193, 7, 0.05) 50%, rgba(244, 67, 54, 0.05) 100%); transform: rotate(-5deg); top: -50px; left: -25%; z-index: 1;"></div>
    <div style="position: absolute; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(76, 175, 80, 0.1) 0%, rgba(76, 175, 80, 0) 70%); top: 30%; right: -50px; z-index: 1;"></div>
  </div>
</div></div>
<div class="vig"></div>
<div class="src">current inspiration: With days to go before the midterms, data shows the U.S. economy is doing well</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
