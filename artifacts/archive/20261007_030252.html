<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Actress Eva Marie Saint, who won an Oscar for 'On the Waterfront,' dies at 102</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="background: radial-gradient(circle at 20% 50%, #0c0c14 0%, #000000 70%); height: 100vh; margin: 0; padding: 0; overflow: hidden; position: relative;">
  <div style="position: absolute; width: 96%; height: 4px; background: linear-gradient(90deg, transparent 0%, #e5d4c066 30%, #e5d4c099 50%, #e5d4c066 70%, transparent 100%); top:隐含%; left: 2%; animation: pulse 18s ease-in-out infinite;"></div>
  <div style="position: absolute; width: 1px; height: 85%; background: linear-gradient(to bottom, transparent 0%, #5a5a6a 15%, transparent 30%); top: 10%; left: 30%; opacity: 0.7;"></div>
  <div style="position: absolute; width: 82%; height: 1px; background: linear-gradient(to right, transparent 0%, #8a7a6a 20%, transparent 40%); top: 65%; left: 10%; opacity: 0.4;"></div>
  <div style="position: absolute; width: 45%; height: 45%; top: 20%; left: 55%; background: radial-gradient(ellipse at center, transparent 30%, #2a1e1a22 80%); border: 1px solid #3a2a2a11; border-radius: 50%;"></div>
  <div style="position: absolute; width: 5px; height: 5px; background: #f0e0d0; border-radius: 50%; top: 25%; left: 25%; opacity: 0.9; box-shadow: 0 0 15px 2px #f0e0d0; animation: glimmer 12s ease-in-out 4s infinite;"></div>
  <div style="position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #4a3a3a 10%, transparent); bottom: 15%; opacity: 0.1;"></div>
</div>
<style>
  @keyframes pulse { 0% { opacity: 0.1; } 50% { opacity: 0.9; } 100% { opacity: 0.1; } }
  @keyframes glimmer { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity:146% 1; transform: scale(1.2); } }
</style></div>
<div class="vig"></div>
<div class="src">current inspiration: Actress Eva Marie Saint, who won an Oscar for 'On the Waterfront,' dies at 102</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
