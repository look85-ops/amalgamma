<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Photos: This may be the most inspirational night school on Earth</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:relative;width:100vw;height:100vh;background:linear-gradient(165deg, #0a0a0f 25%, #1a1a25 60%, #0a0a0f 90%);overflow:hidden;">
  <div style="position:absolute;top:10%;left:5%;width:2px;height:80%;background:linear-gradient(to bottom, transparent 2%, #3a5a78 20%, transparent 98%);opacity:0.7;animation:pulse 9s infinite ease-in-out;"></div>
  <div style="position:absolute;top:15%;right:12%;width:120px;height:400px;background:linear-gradient(to right, #2c3e50 1px, transparent 1px);background-size:20px 100%;opacity:0.4;filter:blur(0.5px);"></div>
  <div style="position:absolute;bottom:20%;left:15%;width:70%;height:4px;background:#4a6b8f;opacity:0.3;border-radius:1px;transform:scaleX(0.2);animation:breathe 11s infinite alternate-reverse;"></div>
  <div style="position:absolute;top:30%;right:20%;width:150px;height:150px;background:radial-gradient(circle, #1e2a3a 2%, transparent 20%);opacity:0.08;"></div>
  <div style="position:absolute;bottom:40%;left:50%;transform:translateX(-50%);width:1px;height:200px;background:linear-gradient(to top, transparent, #5a7a9a 30%, transparent);opacity:0.5;"></div>
  <div style="position:absolute;top:45%;right:8%;width:300px;height:2px;background:#334455;opacity:0.2;animation:move 13s infinite linear;"></div>
  <div style="position:absolute;top:60%;left:10%;width:90px;height:90px;border:1px solid #2a3a4a;border-radius:50%;opacity:0.05;transform:scale(0.3);"></div>
  <div style="position:absolute;bottom:15%;right:25%;width:250px;height:3px;background:#3a4a5a;opacity:0.15;border-radius:2px;transform:scaleX(0.7);"></div>
</div>
<style>
  @keyframes breathe { 0% { transform: scaleX(0.2); } 100% { transform: scaleX(1); } }
  @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 0.3; } }
  @keyframes move { 0% { transform: translateX(0); } 100% { transform: translateX(-50px); } }
</style></div>
<div class="vig"></div>
<div class="src">current inspiration: Photos: This may be the most inspirational night school on Earth</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
