<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Royal Navy sailor in court accused of preparing to spy for Russia</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#0a0e17;position:fixed;top:0;left:0;overflow:hidden"><div style="width:85%;height:200%;background:linear-gradient(90deg, #0a0e17 0%, #0a0e17 30%, #131b2e 50%, #0a0e17 70%, #0a0e17 100%);position:absolute;top:-50%;left:7.5%;animation:pulse 47s infinite linear"></div><div style="width:2px;height:100%;background:linear-gradient(to bottom, transparent, #3a506b 10%, transparent);position:absolute;top:0;left:20%;opacity:0.7"></div><div style="width:1px;height:120%;background:linear-gradient(to bottom, transparent, #1c2d44 15%, transparent);position:absolute;top:-10%;left:45%;animation:drift 33s infinite ease-in-out"></div><div style="width:90%;height:90%;border:1px solid rgba(58,80,107,0.13);position:absolute;top:5%;left:5%"></div><div style="width:70%;height:70%;border:1px solid rgba(28,45,68,0.07);position:absolute;top:15%;left:15%"></div><div style="width:4px;height:4px;background:#5bc0be;border-radius:50%;position:absolute;top:32%;left:63%;opacity:0.9;box-shadow:0 0 dicet black"></div><div style="width:100%;height:1px;background:linear-gradient(90deg, transparent, rgba(91,192,190,0.4) 40%, transparent);position:absolute;top:32%;left:0;animation:scan 19s infinite linear"></div><style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.95}}@keyframes drift{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Royal Navy sailor in court accused of preparing to spy for Russia</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
