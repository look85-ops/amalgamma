<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Scotland's 'Chernobyl' housing scheme takes starring role in new horror film</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:fixed;width:100vw;height:100vh;top:0;left:0;background:#0b0d0e;z-index:-1;overflow:hidden"><div style="width:85vw;height:150vh;transform:rotate(15deg) translateY(-25%);position:absolute;left:-30%;background:repeating-linear-gradient(to right, #24282b 0px, #14171a 90vw, #14171a 90vw, transparent 90.8vw, transparent 91.6vw);border-right:1vw solid rgba(50,20,23,0.6)"></div><div style="position:absolute;top:20%;right:12%;width:33.33vh;height:33.33vh;background:radial-gradient(rgba(139,30,35,0.8)30%,transparent71%);shape-outside:circle();border-radius:50%;filter:blur(8px)"></div><div style="position:absolute;bottom:60%;left:65%;width:44;height:55vh;background:#1e2327"></div><div style="position:absolute;bottom:28%;right:18%;height:33vh;width:3.33%;background:#15191c animation:n1 6.9s infinite;animation-delay:-2s"></div><div style="position:absolute;bottom:36%;right:14%;height:21vh;width:3.33%;background:#1c2024;animation:n133s4sinfinite"><div style="position:absolute;top:19%;right:15%;width:33vw;height:66vh;background:repeating-linear-gradient(to bottom, rgba(139,35,42,0.08)0,transparent0.4,transparent2.1,rgba(35,30,42,0.0t)5vh)f><style>@keyframesn1{O%,60.%,to(height33}v%3O%40%}</div>
<div class="vig"></div>
<div class="src">current inspiration: Scotland's 'Chernobyl' housing scheme takes starring role in new horror film</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
