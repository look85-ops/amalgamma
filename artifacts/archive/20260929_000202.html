<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — U.K. examines if Iran or Russia are involved in foiled attack near base used by U.S.</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:relative;width:100vw;height:100vh;background:#0c0c0c;overflow:hidden"><div style="position:absolute;top:0;left:10%;width:80%;height:2px;background:linear-gradient(90deg, transparent 0%, #5a0000 10%, #5a0000 90%, transparent 100%);animation:pulse 17s infinite ease-in-out;opacity:0"></div><div style="position:absolute;bottom:20%;right:15%;width:300px;height:300px;border:1px solid rgba(90, 90, 100, 0.15);border-radius:50%"></div><div style="position:absolute;top:40%;left:5%;width:94%;height:1px;background:rgba(120, 120, 120, 0.07)"></div><div style="position:absolute;top:70%;left:20%;width:60%;height:0.5px;background:rgba(120, 120, 120, 0.05)"></div><div style="position:absolute;top:10%;right:12%;width:160px;height:160px;background:radial-gradient(circle, rgba(70, 0, 0, 0.03) 0%, transparent 70%);border-radius:50%"></div><div style="position:absolute;bottom:40%;left:12%;width:1px;height:180px;background:linear-gradient(to top, transparent 0%, rgba(90, 90, 100, 0.2) 30%, rgba(90, 90, 100, 0.2) 70%, transparent 100%)"></div><div style="position:absolute;top:15%;left:30%;width:200px;height:200px;border:0.3px solid rgba(80, 80, 100, 0.04);transform:rotate(45deg)"></div><div style="position:absolute;bottom:15%;right:25%;width:3px;height:3px;background:#3a3a3a;border-radius:50%"></div><style>@keyframes pulse {0% {opacity:0} 50% {opacity:0.7} 100% {opacity:0}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: U.K. examines if Iran or Russia are involved in foiled attack near base used by U.S.</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
