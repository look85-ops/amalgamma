<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — NEXT ART AI 2026</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}

.stage{position:fixed;inset:0}
.scene{position:absolute;inset:0;opacity:0}

/* ── Scene 1: Liquid ── */
.scene1{opacity:1;z-index:1}
.s1-bg{position:absolute;inset:0;background:#F4FF8C}
.lbf{position:fixed;inset:0;z-index:2;pointer-events:none;filter:blur(3vmax)}
.lb{position:absolute;border-radius:50%;transform:translate(-50%,-50%);animation:l_morph var(--d) ease-in-out infinite;animation-delay:var(--del)}
@keyframes l_morph{0%,100%{transform:translate(-50%,-50%) scale(.8) rotate(0deg);opacity:.25}33%{transform:translate(-50%,-50%) scale(1.3) rotate(15deg);opacity:.55}66%{transform:translate(-50%,-50%) scale(.6) rotate(-10deg);opacity:.35}}

/* ── Scene 2: Constructivist ── */
.scene2{z-index:2}
.s2-bg{position:absolute;inset:0;background:#4a1c1a}
.blf{position:fixed;inset:0;z-index:2;pointer-events:none}
.bl{position:absolute;height:var(--w);aspect-ratio:1;animation:bl_rise var(--d) ease-in-out infinite;animation-delay:var(--dl);border-radius:calc(var(--br)*1px);opacity:0}
@keyframes bl_rise{0%,100%{opacity:.08;transform:translateY(0)}40%{opacity:.25;transform:translateY(-3vh)}70%{opacity:.12;transform:translateY(1vh)}}
.gls{position:fixed;inset:0;z-index:5;pointer-events:none;mix-blend-mode:overlay;opacity:.04;animation:g_flick 47s steps(47) infinite}
.gls::before{content:"";position:absolute;inset:-20%;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");background-size:256px 256px;animation:g_shift 17s linear infinite}
@keyframes g_shift{0%{transform:translate(0.0) rotate(0deg)}100%{transform:translate(-80px,40px) rotate(.7deg)}}
@keyframes g_flick{0%,100%{opacity:.03}50%{opacity:.07}}

/* ── Scene 3: Pulse ── */
.scene3{z-index:3}
.s3-bg{position:absolute;inset:0;background:#352c57}
.ppf{position:fixed;inset:0;z-index:2;pointer-events:none}
.pf{position:absolute;transform:translate(-50%,-50%);border-radius:50%;animation:p_beat var(--p) ease-in-out infinite;animation-delay:var(--del)}
@keyframes p_beat{0%,100%{transform:translate(-50%,-50%) scale(.7);opacity:.25}50%{transform:translate(-50%,-50%) scale(1.4);opacity:.7}}

/* ── Crossfade timeline (60s total) ── */
/* 0-19s: scene1 full, 19-21s: crossfade 1→2, 21-39s: scene2 full, 39-41s: crossfade 2→3, 41-60s: scene3 full */
.scene1{animation:s1_fade 60s linear infinite}
.scene2{animation:s2_fade 60s linear infinite}
.scene3{animation:s3_fade 60s linear infinite}

@keyframes s1_fade{0%,30%{opacity:1}35%,100%{opacity:0}}
@keyframes s2_fade{0%,30%{opacity:0}35%,65%{opacity:1}70%,100%{opacity:0}}
@keyframes s3_fade{0%,65%{opacity:0}70%,100%{opacity:1}}

/* ── Shared ── */
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.55) 100%)}
.src{position:fixed;bottom:2.8vh;right:3vw;z-index:12;color:rgba(255,255,255,.35);font-size:.65rem;letter-spacing:.06em;pointer-events:none;font-family:system-ui,sans-serif;text-align:right}
.src .line{display:block}
.src1{animation:s1_fade 60s linear infinite}
.src2{animation:s2_fade 60s linear infinite}
.src3{animation:s3_fade 60s linear infinite}
</style>
</head>
