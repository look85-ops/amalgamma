}

/* Turbulence */
.tb{position:fixed;inset:0;z-index:3;pointer-events:none}
.tb .b{position:absolute;left:-2vw;width:104vw;height:var(--h);background:linear-gradient(90deg,rgba(200.150.80.0) 0%,rgba(200.150.80,var(--o)) 15%,rgba(200.150.80,var(--o)) 50%,rgba(200.150.80,var(--o)) 85%,rgba(200.150.80.0) 100%);filter:blur(var(--b));animation:bd var(--d) ease-in-out infinite;animation-delay:var(--del);transform:skewY(var(--sk))}
@keyframes bd{0%,100%{top:var(--y1);opacity:1}33%{top:var(--y2);opacity:.6}66%{top:var(--y3);opacity:.85}}

/* Particles */
.pts{position:fixed;inset:0;z-index:4;pointer-events:none}
.pts .p{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,rgba(240.210.140,.95) 0%,rgba(220.180.100,.35) 40%,transparent 70%);filter:blur(calc(var(--s)*.5));animation:pp var(--p) ease-in-out infinite;animation-delay:var(--del);left:var(--x);top:var(--y)}

@keyframes gs{0%{transform:translate(0.0) rotate(0deg)}100%{transform:translate(-80px,40px) rotate(.7deg)}}
@keyframes gf{0%,100%{opacity:.04}50%{opacity:.08}}

/* Vignette */

/* Source */
