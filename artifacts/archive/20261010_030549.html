<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Trump says U.S. to get diesel from Russia, relaxing pressure on Moscow to ease prices before midterms</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="width:100vw;height:100vh;background:#0a0a0a;position:relative;overflow:hidden">
<div style="width:85%;height:120%;position:absolute;top:-10%;left:7.5%;background:repeating-linear-gradient(90deg, transparent 0%, transparent 87.5%, #3a2412 87.5%, #3a2412 92.5%, transparent 92.5%);background-size:8vw 100%;opacity:0.15"></div>
<div style="position:absolute;width:40%;height:140%;top:-20%;left:48%;background:#2a2a2a;transform:skewX(-15deg);opacity:0.8"></div>
<div style="position:absolute;width:2%;height:150%;top:-25%;left:60%;background:linear-gradient(to right, #2a2a2a, #5c3a21, #2a2a2a);opacity:0.6"></div>
<div style="position:absolute;width:15%;height:15%;top:25%;left:20%;background:#221100;border-radius:50%;opacity:0.03;filter:blur(15px)"></div>
<div style="position:absolute;width:10%;height:10%;top:65%;left:70%;background:#1a0a00;border-radius:50%;opacity:0.04;filter:blur(20px)"></div>
<div style="position:absolute;width:92%;height:3%;top:45%;left:4%;background:#1c1c1c;opacity:0.7"></div>
<div style="position:absolute;width:3%;height:80%;top:10%;left:23%;background:#333;opacity:0.2;animation:pulse 6s ease-in-out infinite"></div>
<div style="position:absolute;width:30%;height:200%;top:-50%;right:0;background:linear-gradient(90deg, transparent, #0f0f0f 40%);opacity:0.9"></div>
</div>
<style>@keyframes pulse { 0%, 100% { opacity:0.2 } 50% { opacity:0.05 } }</style></div>
<div class="vig"></div>
<div class="src">current inspiration: Trump says U.S. to get diesel from Russia, relaxing pressure on Moscow to ease prices before midterms</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
