<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Ten climbers missing after avalanche hits Himalayan base camp</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="position:relative;width:100vw;height:100vh;background-color:#0a0a12;overflow:hidden;"><div style="position:absolute;top:15%;left:10%;width:82%;height:0;border-bottom:3px solid #2a3a5a;opacity:0.7;"></div><div style="position:absolute;top:30%;left:5%;width:2px;height:50%;background:linear-gradient(to bottom, transparent, #4a5a7a, transparent);"></div><div style="position:absolute;top:25%;right:12%;width:18%;height:60%;background-color:#111827;clip-path:polygon(20% 0, 100% 15%, 85% 100%, 0 90%);opacity:0.4;"></div><div style="position:absolute;bottom:20%;left:20%;width:60%;height:1px;background-color:#3a4a6a;animation:pulse 9s infinite ease-in-out;opacity:0.5;"></div><div style="position:absolute;top:40%;right:25%;width:8px;height:8px;border-radius:50%;background-color:#65789c;box-shadow:0 0 12px #65789c;animation:fade 7s infinite alternate;"></div><div style="position:absolute;top:60%;left:15%;width:30%;height:70px;background-color:#151e30;transform:skewX(-15deg);opacity:0.3;"></div><div style="position:absolute;bottom:35%;right:8%;width:1px;height:100px;background-color:#2a3a5a;animation:breath 11s infinite alternate;"></div><div style="position:absolute;top:10%;left:40%;width:150px;height:200px;border:1px solid #1e293b;opacity:0.2;transform:rotate(5deg);"></div><style>@keyframes pulse{0%,100%{opacity:0.2;}50%{opacity:0.7;}}@keyframes fade{0%{opacity:0.1;}100%{opacity:0.8;}}@keyframes breath{0%{height:30px;opacity:0.3;}100%{height:130px;opacity:0.7;}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: Ten climbers missing after avalanche hits Himalayan base camp</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
