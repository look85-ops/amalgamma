<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — U.N. Ambassador Mike Waltz on Iran, Venezuela and Trump's foreign policy</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="height:100vh;width:100vw;background:linear-gradient(90deg,#0a0a12 30%,transparent 30%,transparent 70%,#0a0a12 70%);position:relative;overflow:hidden;opacity:0.98"><div style="position:absolute;height:12%;width:1.5%;background:#5c5c64;bottom:22%;left:23%;transform:translate(-50%,0)"></div><div style="position:absolute;height:24%;width:20%;background:#2d2d3a;bottom:6%;right:15%"></div><div style="position:absolute;height:6%;width:6%;background:#8b0000;border-radius:50%;bottom:32%;left:52%;animation:pulse 9s ease-in-out infinite"></div><div style="position:absolute;height:40%;width:2%;background:#3a3a47;top:18%;right:31%;opacity:0.7"></div><div style="position:absolute;height:2%;width:60%;background:#4a4a59;top:34%;left:7%"></div><div style="position:absolute;height:100%;width:0.3%;background:#888;left:44%;top:0;opacity:0.3"></div><div style="position:absolute;height:30%;width:18%;background:linear-gradient(to bottom,#1a1a22,#0a0a12);bottom:0;left:36%"></div><div style="position:absolute;height:48%;width:0.5%;background:#666;top:10%;left:66%;opacity:0.4;animation: breath 14s infinite"></div><div style="position:absolute;height:2.5%;width:22%;background:#8b7355;bottom:42%;right:5%;opacity:0.8"></div><style>@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.85}}@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}</style></div></div>
<div class="vig"></div>
<div class="src">current inspiration: U.N. Ambassador Mike Waltz on Iran, Venezuela and Trump's foreign policy</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
