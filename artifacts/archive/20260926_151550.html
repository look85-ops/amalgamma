<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgama — Supreme Court blocks Trump-backed Missouri congressional map</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
.artifact{position:fixed;inset:0;z-index:1}
.vig{position:fixed;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 50% 48%,transparent 0%,transparent 55%,rgba(0,0,0,.4) 100%)}
.src{position:fixed;bottom:2.8vh;left:2.8vw;z-index:12;color:rgba(255,255,255,.6);font-size:.7rem;letter-spacing:.04em;pointer-events:none;font-family:system-ui,sans-serif;animation:s_fade 89s ease-in-out infinite;max-width:60vw;line-height:1.4;text-shadow:0 0 8px rgba(0,0,0,.5)}
@keyframes s_fade{0%,100%{opacity:.25}50%{opacity:.5}}
</style>
</head>
<body>
<div class="artifact"><div style="height:100vh; background:#0c0c16; display:flex; align-items:center; overflow:hidden; position:relative">
  <div style="flex:1; height:70%; position:relative">
    <div style="position:absolute; top:15%; left:12%; width:76%; height:8%; background:linear-gradient(90deg, transparent, #6a6a95 30%, #6a6a95 70%, transparent); opacity:0.9; animation:expandHor 14s infinite alternate ease-in-out"></div>
    <div style="position:absolute; bottom:40%; left:10%; width:80%; height:40%; background:none; border-left:2px solid #2c2c45; border-bottom:2px solid #2c2c45; opacity:0.35"></div>
    <div style="position:absolute; bottom:30%; right:20%; width:55%; height:12%; background:#22223a; animation:pulseMass 25s infinite both"></div>
  </div>
  <div style="flex:0.8; height:80%; position:relative; margin-right:5%">
    <div style="position:absolute; top:5%; right:25%; width:65%; height:30%; background:none; border-top:2.5px solid #404060"></div>
    <div style="position:absolute; top:50%; right:15%; width:60%; height:7.5%; background:#48486d; animation:pullWidth 37s infinite linear"></div>
    <div style="position:absolute; bottom:20%; right:0; width:85%; height:25%; background:linear-gradient(transparent 15%, #101020, transparent 85%); opacity:0.8"></div>
  </div>
</div>
<style>
  @keyframes expandHor {
    0% { transform:scaleX(0.82); opacity:0.65;}
    100% { transform:scaleX(1.1); opacity:1;}
  }
  @keyframes pulseMass {
    0%,100% { transform:translateX(0) scaleY(1); opacity:0.4;}
    85% { transform:translateX(-5%) scaleY(1.08); opacity:0.7;}
  }
  @keyframes pullWidth {
    0% { width:60%; background:#48486d; }
    95%,100% { width:61%; background:#505080;}
  }
</style></div>
<div class="vig"></div>
<div class="src">current inspiration: Supreme Court blocks Trump-backed Missouri congressional map</div>
<script>
(() => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  const drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 55;
  const droneLFO = ctx.createOscillator();
  droneLFO.type = 'sine';
  droneLFO.frequency.value = 0.07;
  const droneLFOGain = ctx.createGain();
  droneLFOGain.gain.value = 8;
  droneLFO.connect(droneLFOGain);
  droneLFOGain.connect(drone.frequency);
  droneLFO.start();
  const droneVol = ctx.createGain();
  droneVol.gain.value = 0.04;
  drone.connect(droneVol);
  droneVol.connect(master);
  drone.start();
  const noiseLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
  const ndata = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) ndata[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuf;
  noise.loop = true;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 300;
  noiseFilter.Q.value = 0.5;
  const noiseVol = ctx.createGain();
  noiseVol.gain.value = 0.02;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseVol);
  noiseVol.connect(master);
  noise.start();
  const pulse = ctx.createOscillator();
  pulse.type = 'sine';
  pulse.frequency.value = 28;
  const pulseVol = ctx.createGain();
  pulseVol.gain.value = 0;
  pulse.connect(pulseVol);
  pulseVol.connect(master);
  pulse.start();
  function update(t) {
    const w = 1 + Math.sin(t * 0.3) * 0.08 + Math.sin(t * 0.13) * 0.06;
    master.gain.value = w * 0.35;
    const p = (t % 8.3) / 8.3;
    pulseVol.gain.value = (p < 0.08 ? (1 - p / 0.08) * 0.06 : 0);
    requestAnimationFrame(update);
  }
  function init() {
    if (ctx.state === 'suspended') ctx.resume();
    requestAnimationFrame(update);
    document.removeEventListener('click', init);
  }
  document.addEventListener('click', init);
  setTimeout(() => { if (ctx.state === 'suspended') ctx.resume(); requestAnimationFrame(update); }, 500);
})();
</script>
</body>
</html>
